<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Bibliotheks-Quest</title>
<style>
:root{--bg:#2b1d14;--panel:#3d2a1c;--ink:#f6ecd9;--accent:#e9b44c;--ok:#7bc47f;--bad:#e07a5f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;touch-action:manipulation}
#app{max-width:720px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
h1{font-size:18px;margin:0;color:var(--accent)}
#bar{height:12px;background:#1a110b;border-radius:6px;overflow:hidden}
#fill{height:100%;width:0;background:var(--accent);transition:width .5s}
#wrap{position:relative}
canvas{width:100%;display:block;border-radius:8px;border:3px solid var(--panel);image-rendering:pixelated;background:#c9a56b}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#000c;padding:6px 12px;border-radius:14px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;width:max-content;max-width:92%}
#pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:4px}
#pad button{font-size:22px;border:0;border-radius:10px;background:var(--panel);color:var(--ink)}
#pad button:active{background:var(--accent);color:#000}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
.hint{font-size:12px;text-align:center;opacity:.7}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:5}
#ov.on{display:flex}
.card{background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:18px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
.card h2{margin:0 0 4px;color:var(--accent);font-size:20px}
.card .sub{font-size:13px;opacity:.8;margin-bottom:10px}
.card p{line-height:1.45;margin:8px 0}
.btn,.opt{display:block;width:100%;margin:6px 0;padding:11px;border:0;border-radius:9px;background:#5a3f2a;color:var(--ink);font:inherit;font-size:16px;text-align:left}
.btn{background:var(--accent);color:#2b1d14;text-align:center;font-weight:bold}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #fff4;font-weight:normal}
.opt:disabled{opacity:.4}
input{width:100%;padding:11px;border-radius:9px;border:2px solid var(--accent);background:#1a110b;color:var(--ink);font:inherit;font-size:16px}
#info{border:0;background:var(--panel);color:var(--ink);border-radius:50%;width:32px;height:32px;font-size:16px}
.facts{margin:8px 0;padding:0;list-style:none;font-size:15px}.facts li{margin:4px 0}
.quote{white-space:pre-wrap;background:#1a110b;border-left:4px solid var(--accent);border-radius:6px;padding:10px;font-size:14px;line-height:1.45;margin:6px 0}
.msg{min-height:22px;font-size:14px;margin-top:4px}
.bad{color:var(--bad)}.ok{color:var(--ok)}
</style>
</head>
<body>
<div id="app">
  <header><h1>📚 Bibliotheks-Quest</h1><span id="lvl"></span><span id="xp"></span><button id="info" aria-label="Über dieses Spiel">ℹ️</button></header>
  <div id="bar"><div id="fill"></div></div>
  <div id="wrap"><canvas id="c" width="480" height="288"></canvas><div id="toast"></div></div>
  <div id="pad"><button class="u" data-k="0,-1">▲</button><button class="l" data-k="-1,0">◀</button><button class="d" data-k="0,1">▼</button><button class="r" data-k="1,0">▶</button></div>
  <div class="hint">Steuerung: Pfeiltasten / WASD oder die Tasten oben. Tritt auf 📖, um eine Aufgabe zu starten.</div>
</div>
<div id="ov"><div class="card" id="card"></div></div>

<script>
const TS=32, MAXXP=280;
const LEVELS=[
{name:"Level 1 · Das Foyer",stars:"★☆☆",
 map:["###############","#P............#","#.####.#####..#","#.#1.........2#","#.####.#####..#","#.............#","#.####.#####.##","#............B#","###############"],
 tasks:{
  1:{t:"order",xp:10,title:"Alphabetisch einsortieren",q:"Stelle die Autor*innen in alphabetischer Reihenfolge ins Regal. Tippe sie nacheinander an.",items:["Brecht","Mann","Zweig"]},
  2:{t:"choice",xp:10,title:"Dewey-Dezimal",q:"In der Dewey-Dezimalklassifikation stehen Bücher über Naturwissenschaften unter der Nummer …",opts:["100","500","800"],a:1},
  B:{t:"text",xp:30,title:"Das Rätsel der Bibliothekar*in",q:"Ich habe viele Seiten, aber keine Haut. Ich habe einen Rücken, aber keinen Körper. Ich erzähle, ohne zu sprechen. Was bin ich? (ein Wort)",a:["buch","ein buch","das buch"],hint:"Du findest mich hier tausendfach."}}},
{name:"Level 2 · Die Lesesäle",stars:"★★☆",
 map:["###############","#P....#.......#","#.###.#.####..#","#.#1..#.#2....#","#.#####.#####.#","#.............#","#.####.#.####.#","#......#.....B#","###############"],
 tasks:{
  1:{t:"order",xp:20,title:"Geschichte des Schreibens",q:"Bringe die Medien in die zeitlich richtige Reihenfolge (älteste zuerst).",items:["Keilschrift","Papyrusrolle","Gutenberg-Buchdruck","E-Book"]},
  2:{t:"choice",xp:20,title:"ISBN-Detektiv*in",q:"Aus wie vielen Ziffern besteht eine moderne ISBN (seit 2007)?",opts:["10","11","13","15"],a:2},
  B:{t:"text",xp:50,title:"Inventur im Regal",q:"Ein Regal hat 5 Bretter mit je 12 Büchern. 17 Bücher sind ausgeliehen, dafür wurden 8 neue geliefert und eingestellt. Wie viele Bücher stehen jetzt im Regal?",a:["51"],hint:"5 × 12 − 17 + 8"}}},
{name:"Level 3 · Das Geheimarchiv",stars:"★★★",
 map:["###############","#P..#.....#..1#","#.#.#.#####.#.#","#.#...#2..#...#","#.#.###.#.#.#.#","#...#...#...#.#","#.###.#.###.#.#","#.....#.....B.#","###############"],
 tasks:{
  1:{t:"choice",xp:30,title:"Binärer Katalog",q:"Der Katalogcode lautet 1010 (binär). Welche Dezimalzahl ist das?",opts:["8","10","12","14"],a:1},
  2:{t:"order",xp:30,title:"Dewey im Archiv",q:"Sortiere die Fächer nach ihrer Dewey-Hauptklasse (aufsteigend).",items:["Philosophie (100)","Religion (200)","Sprache (400)","Kunst (700)","Geschichte (900)"]},
  B:{t:"text",xp:80,title:"Der Geheimcode des Archivs",q:"Eine Notiz im Archiv lautet ELEOLRWKHN. Es ist ein Caesar-Code: Jeder Buchstabe wurde im Alphabet um 3 Stellen nach vorne verschoben. Wie lautet das Lösungswort?",a:["bibliothek"],hint:"E ← B, L ← I, E ← B …"}}}
];

const $=id=>document.getElementById(id), cv=$("c"), g=cv.getContext("2d");
let lv=0, xp=0, done={}, pos={x:1,y:1}, busy=false, rows;

function startLevel(i){
  lv=i; done={}; rows=LEVELS[i].map;
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch==="P")pos={x,y}}));
  $("lvl").textContent=LEVELS[i].name; draw(); updHud();
  toast("Finde 📖 ①, 📖 ② und danach die große Aufgabe 🏆");
}
const tile=(x,y)=>(rows[y]||"")[x]||"#";
function updHud(){$("xp").textContent="⭐ "+xp+" XP";$("fill").style.width=(xp/MAXXP*100)+"%"}
let tt;function toast(s){const t=$("toast");t.textContent=s;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,2600)}

function draw(){
  g.fillStyle="#c9a56b";g.fillRect(0,0,480,288);
  g.textAlign="center";g.textBaseline="middle";
  for(let y=0;y<rows.length;y++)for(let x=0;x<15;x++){
    const ch=tile(x,y),px=x*TS,py=y*TS;
    if((x+y)%2){g.fillStyle="#bf9a60";g.fillRect(px,py,TS,TS)}
    if(ch==="#"){
      g.fillStyle="#4a2e1a";g.fillRect(px,py,TS,TS);
      const c=["#c0392b","#2e86ab","#e9b44c","#5b8c5a","#8e5ea2"];
      for(let i=0;i<5;i++){g.fillStyle=c[(x*3+y*5+i)%5];g.fillRect(px+3+i*5.5,py+5,4.5,10);g.fillStyle=c[(x+y*2+i*2)%5];g.fillRect(px+3+i*5.5,py+18,4.5,10)}
    }
    if("12B".includes(ch)){g.font="22px serif";g.fillStyle="#000";g.fillText(done[ch]?"✅":ch==="B"?"🏆":"📖",px+16,py+17)}
  }
  g.font="24px serif";g.fillText("🧑",pos.x*TS+16,pos.y*TS+17);
}

function move(dx,dy){
  if(busy)return;
  const nx=pos.x+dx,ny=pos.y+dy;
  if(tile(nx,ny)==="#")return;
  pos={x:nx,y:ny};draw();
  const ch=tile(nx,ny);
  if("12B".includes(ch)&&!done[ch]){
    if(ch==="B"&&!(done[1]&&done[2]))toast("🔒 Erledige erst die beiden kleinen Aufgaben!");
    else openTask(ch);
  }
}
addEventListener("keydown",e=>{
  const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];
  if(m){e.preventDefault();move(...m)}
});
document.querySelectorAll("#pad button").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();move(...b.dataset.k.split(",").map(Number))}));

const h=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
function show(){busy=true;$("ov").classList.add("on");const c=$("card");c.innerHTML="";return c}
function hide(){busy=false;$("ov").classList.remove("on")}

function openTask(k){
  const t=LEVELS[lv].tasks[k],c=show();
  c.append(h("h2","",(k==="B"?"🏆 ":"📖 ")+t.title),h("div","sub",`${LEVELS[lv].stars} · +${t.xp} XP`),h("p","",t.q));
  const msg=h("div","msg");
  const win=()=>{xp+=t.xp;done[k]=true;draw();updHud();msg.className="msg ok";msg.textContent="Richtig! +"+t.xp+" XP";
    setTimeout(()=>{hide();k==="B"?finishLevel():toast("+"+t.xp+" XP 🎉")},900)};
  const fail=s=>{msg.className="msg bad";msg.textContent=s};
  if(t.t==="choice"){
    t.opts.forEach((o,i)=>{const b=h("button","opt",o);b.onclick=()=>{i===t.a?win():(fail("Leider falsch, versuche es noch einmal."),b.disabled=true)};c.append(b)});
  }else if(t.t==="text"){
    const inp=h("input");inp.placeholder="Deine Antwort …";inp.autocomplete="off";
    const b=h("button","btn","Antworten");
    b.onclick=()=>{const v=inp.value.trim().toLowerCase();t.a.includes(v)?win():fail("Nicht ganz. "+(t.hint?"Tipp: "+t.hint:""))};
    inp.onkeydown=e=>{e.stopPropagation();if(e.key==="Enter")b.click()};
    c.append(inp,b);setTimeout(()=>inp.focus(),50);
  }else{
    let pick=[];const line=h("p","sub","Reihenfolge: –");
    const order=t.items.map((x,i)=>[x,i]).sort(()=>Math.random()-.5);
    const btns=order.map(([x,i])=>{const b=h("button","opt",x);b.onclick=()=>{
      pick.push(i);b.disabled=true;line.textContent="Reihenfolge: "+pick.map(p=>t.items[p]).join(" → ");
      if(pick.length===t.items.length){
        if(pick.every((v,j)=>v===j))win();
        else{fail("Das stimmt noch nicht, die Bücher werden neu sortiert.");setTimeout(()=>{pick=[];btns.forEach(x=>x.disabled=false);line.textContent="Reihenfolge: –"},900)}}};
      c.append(b);return b});
    c.append(line);
  }
  c.append(msg);
  const x=h("button","btn ghost","Später wiederkommen");x.onclick=hide;c.append(x);
}

function finishLevel(){
  const last=lv===LEVELS.length-1;
  if(last){openAbout(true);return}
  const c=show();
  {
    c.append(h("h2","",`✅ ${LEVELS[lv].name} abgeschlossen`),h("p","",`Aktuell: ${xp} XP. Im nächsten Level wird es schwieriger.`));
    const b=h("button","btn","Weiter zu Level "+(lv+2));b.onclick=()=>{hide();startLevel(lv+1)};c.append(b);
  }
}
/* ===== Info-Bereich: hier kannst du die Angaben anpassen ===== */
const ABOUT={
  model:"Claude Sonnet 5.5 (Anthropic)",
  duration:"ca. 5 Minuten Generierung, insgesamt ca. 60 Minuten inkl. Testen, kleinen Anpassungen und Veröffentlichen",
  prompts:[
   "Programmiere ein kleines Web-Spiel, bei dem ich durch eine Bibliothek laufe und Aufgaben absolvieren muss. Das ganze hat drei Level mit progressiven Schwierigkeitsstufen. In jedem Level habe ich zwei kleine Aufgaben und eine größere Aufgabe am Ende. Mit jeder abgeschlossenen Aufgabe kann man XP sammeln, passend zum Schwierigkeitsgrad. Bereite das ganze so auf, dass ich es auf GitHub hochladen kann und über einen QR-Code zur Verfügung stellen kann."]
};
function openAbout(finale){
  if(busy&&!finale)return;
  const c=show();
  if(finale)c.append(h("h2","","🎓 Geschafft!"),h("p","",`Du hast das Geheimarchiv geknackt und ${xp} von ${MAXXP} XP gesammelt. Du bist jetzt offiziell Ehrenbibliothekar*in!`));
  c.append(h("h2","","ℹ️ Über dieses Spiel"),
    h("p","","Dieses Spiel wurde komplett per Vibe Coding erstellt: Ich habe beschrieben, was ich möchte, und eine KI hat den Code generiert."));
  const ul=h("ul","facts");
  [["🤖 Modell",ABOUT.model],["⏱️ Dauer",ABOUT.duration]].forEach(([k,v])=>{const li=h("li");li.append(h("b","",k+": "),document.createTextNode(v));ul.append(li)});
  c.append(ul,h("p","sub",ABOUT.prompts.length>1?"Verwendete Prompts:":"Verwendeter Prompt:"));
  ABOUT.prompts.forEach(p=>c.append(h("div","quote",p)));
  if(finale){const r=h("button","btn","Nochmal spielen");r.onclick=()=>{xp=0;hide();startLevel(0)};c.append(r)}
  else{const b=h("button","btn","Zurück zum Spiel");b.onclick=hide;c.append(b)}
}
$("info").onclick=()=>openAbout(false);
startLevel(0);
</script>
</body>
</html>
